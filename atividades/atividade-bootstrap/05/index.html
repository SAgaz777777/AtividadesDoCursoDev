<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cor de texto com Bootstrap</title>
</head>
<body>
    <!-- Margens 1 até 5 -->
     <div class="m-1">Margem tamanho 1</div>
     <div class="mt-3">Margem só em cima</div>
     <div class="mb-3">Margem só embaixo</div>

     <!-- Paddings: p1 até p5 -->
     <div class="p-4">Padding tamanho 1</div>
     <div class="pt-4">Padding só em cima</div>
     <div class="pb-4">Padding só embaixo</div>

    <!-- Cores de texto -->
    <p class="text-primary">Azul</p>
    <p class="text-success">Verde</p>
    <p class="text-danger">Vermelho</p>
    <p class="text-warning">Amarelo</p>
    <p class="text-info">Azul claro</p>
</body>
</html>
