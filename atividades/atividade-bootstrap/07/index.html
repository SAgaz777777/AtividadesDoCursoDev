<!doctype html>
<html lang="pt-br">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        .login-card {
            max-width: 400px;
            margin: 50px auto;
        }
    </style>
    <title>Login</title>
  </head>
  <body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="mx-auto" style="max-width: 400px">
        <div class="card shadow border-0 rounded-3">
          <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">Bem-vindo</h3>
          </div>
          <div class="card-body p-4">
            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Digite seu email"
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Digite sua senha"
                />
              </div>

              <div class="mb-3 form-check d-flex align-items-center gap-2">
                <input
                  type="checkbox"
                  class="form-check-input mt-0"
                  id="lembrarSenha"
                />
                <label class="form-check-label text-muted" for="lembrarSenha"
                  >Lembrar-me</label
                >
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 mb-3 py-2 fw-bold"
              >
                Entrar
              </button>

              <a href="#" class="d-block text-center text-decoration-none"
                >Esqueceu a senha?</a
              >
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
