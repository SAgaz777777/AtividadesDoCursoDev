<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Dropdown customizado do zero */
        .meu-dropdown { position: relative; display: inline-block; }
        .meu-dropdown-content {
            display: none; position: absolute; right: 0;
            background: #fff; border: 1px solid #ddd; min-width: 160px; z-index: 1000;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1); border-radius: 5px;
        }
        .meu-dropdown-content a { color: black; padding: 12px 16px; text-decoration: none; display: block; }
        .meu-dropdown-content a:hover { background-color: #f1f1f1; }
        .meu-dropdown:hover .meu-dropdown-content { display: block; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark p-3">
    <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">☰ Menu</button>
    <div class="meu-dropdown">
        <button class="btn btn-primary">👤 Meu Perfil ▼</button>
        <div class="meu-dropdown-content">
            <a href="#">Ver Perfil</a>
            <a href="#">Segurança</a>
            <hr class="m-0">
            <a href="#" class="text-danger">Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <ul class="nav nav-tabs" id="dashTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#resumo">Resumo</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#detalhes">Detalhes</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#config">Configurações</button></li>
    </ul>
    <div class="tab-content border border-top-0 p-4">
        <div class="tab-pane fade show active" id="resumo">Gráficos e estatísticas aqui.</div>
        <div class="tab-pane fade" id="detalhes">Lista detalhada de atividades.</div>
        <div class="tab-pane fade" id="config">Ajustes gerais do dashboard.</div>
    </div>
</div>

<div class="offcanvas offcanvas-start bg-dark text-white" id="menuLateral">
    <div class="offcanvas-header"><h5>DashMenu</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
        <nav class="nav flex-column">
            <a class="nav-link text-white" href="#">📊 Relatórios</a>
            <a class="nav-link text-white" href="#">💰 Vendas</a>
            <a class="nav-link text-white" href="#">👥 Clientes</a>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
