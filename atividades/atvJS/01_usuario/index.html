<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
</head>
<body>
    
<h1>Informe suas informações</h1>

<div>
    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Informe seu nome">
</div>

<br>

<div>
    <label for="sobrenome">Sobrenome</label>
    <input type="text" id="sobrenome" placeholder="Informe seu sobrenome"> 
</div>

<br>

<div>
    <label for="idade">Idade</label>
    <input type="number" id="idade" placeholder="Informe sua idade">
</div>

<br>

<div>
    <label for="peso">Peso</label>
    <input type="number" id="peso" placeholder="Informe seu peso em KG">
</div>

<br>

<div>
    <button onclick="Mensagem()">Exibir</button>
</div>

<br>

<div id="mensagem"></div>

<script src="script.js"></script>

</body>
</html>
