<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olá, Bootstrap - CDN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="alert alert-primary text-center">
        <h1>🚀 Olá, Bootstrap!</h1>
        <p>Este site está usando Bootstrap via CDN</p>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">CDN</h5>
              <p class="card-text">Arquivos carregados da internet</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Rápido</h5>
              <p class="card-text">Não precisa baixar nada</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Online</h5>
              <p class="card-text">Precisa de internet</p>
            </div>
          </div>
        </div>
      </div>

      <hr class="my-5" />

      <ul class="nav nav-tabs" id="minhasAbas" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            data-bs-toggle="tab"
            data-bs-target="#home"
            type="button"
          >
            Home
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#perfil"
            type="button"
          >
            Perfil
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#config"
            type="button"
          >
            Configurações
          </button>
        </li>
      </ul>

      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="home">
          Conteúdo da aba Home
        </div>
        <div class="tab-pane fade" id="perfil">
          Conteúdo do Perfil do usuário
        </div>
        <div class="tab-pane fade" id="config">Configurações do sistema</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
