<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - FAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Perguntas Frequentes</h2>
    
    <div class="accordion" id="faqAccordion">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#q1">
                    Como alterar minha senha? <span class="badge bg-info ms-2">Conta</span>
                </button>
            </h2>
            <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faqAccordion">
                <div class="accordion-body text-center">
                    <div class="spinner-border spinner-border-sm text-primary"></div> Carregando instruções...
                    <p class="mt-2">Vá em configurações > segurança e clique em alterar senha.</p>
                </div>
            </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#q2">
                    Quais formas de pagamento? <span class="badge bg-success ms-2">Pagamento</span>
                </button>
            </h2>
            <div id="q2" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body text-center">
                    <div class="spinner-grow spinner-grow-sm text-success"></div> Buscando métodos...
                    <p class="mt-2">Aceitamos Pix, Cartão de Crédito e Boleto.</p>
                </div>
            </div>
        </div>
    </div>
    <p class="text-muted mt-3">* 4 perguntas simuladas com spinners de carregamento.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
