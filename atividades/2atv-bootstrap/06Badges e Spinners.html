<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olá, Bootstrap - CDN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="alert alert-primary text-center">
        <h1>🚀 Olá, Bootstrap!</h1>
        <p>Este site está usando Bootstrap via CDN</p>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">CDN</h5>
              <p class="card-text">Arquivos carregados da internet</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Rápido</h5>
              <p class="card-text">Não precisa baixar nada</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Online</h5>
              <p class="card-text">Precisa de internet</p>
            </div>
          </div>
        </div>
      </div>

      <hr class="my-5" />

      <div class="text-center">
        <h1>Notificações <span class="badge bg-danger">99+</span></h1>

        <div class="my-3">
          <button class="btn btn-primary">
            Mensagens <span class="badge bg-light text-dark">7</span>
          </button>
        </div>

        <div>
          <span class="badge rounded-pill bg-success">Sucesso</span>
          <span class="badge rounded-pill bg-warning text-dark">Atenção</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
