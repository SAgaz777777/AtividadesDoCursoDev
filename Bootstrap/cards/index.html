<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria</title>
    <style>
        .foto-placeholder {
            height: 200px;
            background: linear-gradient(45deg, #3498db, #9b59b6);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">gragolandia</h2>
        <div class="row">
            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="card">
                    
                    <div class="foto-placeholder"></div>
                    <div class="card-body">
                        <h5 class="card-title">Por do sol</h5>
                        <p class="card-text">Foto tirada na praia</p>
                    </div>
                </div>
            </div>


            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="card">
                    <div class="foto-placeholder"></div>
                    <div class="card-body">
                        <h5 class="card-title">Montanhas</h5>
                        <p class="card-text">Vista da serra</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="card">
                    <div class="foto-placeholder"></div>
                    <div class="card-body">
                        <h5 class="card-title">Cidade</h5>
                        <p class="card-text">Vista Noturna</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="card">
                    <div class="foto-placeholder"></div>
                    <div class="card-body">
                        <h5 class="card-title">Floresta</h5>
                        <p class="card-text">Trilha na mata</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
